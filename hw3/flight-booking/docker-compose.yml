version: '3.8'

services:
  flight-db:
    image: postgres:16
    environment:
      POSTGRES_DB: flights
      POSTGRES_USER: flight_user
      POSTGRES_PASSWORD: flight_pass
    ports: ["5433:5432"]
    volumes: [flight-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_user -d flights"]
      interval: 5s
      retries: 5

  booking-db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports: ["5434:5432"]
    volumes: [booking-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d bookings"]
      interval: 5s
      retries: 5

  redis-master:
    image: redis:7
    command: redis-server
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  redis-slave:
    image: redis:7
    command: redis-server --replicaof redis-master 6379
    depends_on:
      redis-master: {condition: service_healthy}

  redis-sentinel-1:
    image: redis:7
    command: >
      sh -c "sleep 10;
             cp /etc/sentinel.conf /tmp/sentinel.conf;
             redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./sentinel.conf:/etc/sentinel.conf:ro
    depends_on:
      redis-master: {condition: service_healthy}
    ports: ["26379:26379"]

  redis-sentinel-2:
    image: redis:7
    command: >
      sh -c "sleep 10;
             cp /etc/sentinel.conf /tmp/sentinel.conf;
             redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./sentinel.conf:/etc/sentinel.conf:ro
    depends_on:
      redis-master: {condition: service_healthy}

  redis-sentinel-3:
    image: redis:7
    command: >
      sh -c "sleep 10;
             cp /etc/sentinel.conf /tmp/sentinel.conf;
             redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./sentinel.conf:/etc/sentinel.conf:ro
    depends_on:
      redis-master: {condition: service_healthy}

  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://flight_user:flight_pass@flight-db:5432/flights
      REDIS_SENTINELS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER: mymaster
      API_KEY: super-secret-service-key-123
    depends_on:
      flight-db: {condition: service_healthy}
      redis-master: {condition: service_healthy}
    ports: ["50051:50051"]

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://booking_user:booking_pass@booking-db:5432/bookings
      FLIGHT_SERVICE_HOST: flight-service
      FLIGHT_SERVICE_PORT: 50051
      API_KEY: super-secret-service-key-123
      CB_FAILURE_THRESHOLD: 5
      CB_RECOVERY_TIMEOUT: 30
    depends_on:
      booking-db: {condition: service_healthy}
      flight-service: {condition: service_started}
    ports: ["8000:8000"]

volumes:
  flight-data:
  booking-data: